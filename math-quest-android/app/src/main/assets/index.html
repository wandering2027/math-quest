<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数学征途 - Kevin的数学冒险</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root {
  --bg: #131f24; --bg-card: #1c2d34; --primary: #58cc02; --primary-dark: #46a302;
  --primary-light: #89e219; --blue: #1cb0f6; --blue-dark: #1899d6; --purple: #ce82ff;
  --orange: #ff9600; --red: #ff4b4b; --yellow: #ffc800; --text: #fff; --text-secondary: #8b9ca3;
  --border: #37464f; --card: #25363d;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
.view{display:none;min-height:100vh;padding-bottom:70px}
.view.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* 顶部状态栏 */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);position:sticky;top:0;z-index:100;border-bottom:2px solid var(--border)}
.stat-item{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px}
.stat-item svg{width:22px;height:22px}
.level-badge{display:flex;align-items:center;gap:6px;background:var(--card);padding:4px 10px;border-radius:20px;border:2px solid var(--border)}
.level-badge .flag{width:24px;height:24px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--bg)}
.level-badge .level-text{font-size:13px;font-weight:700}

/* 经验条 */
.xp-bar-container{margin:0 16px 12px}
.xp-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin-bottom:4px;font-weight:600}
.xp-bar{height:8px;background:var(--card);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--yellow),#ffd633);border-radius:4px;transition:width .6s ease}

/* 阶段选择 */
.stage-page{padding:20px 16px}
.stage-title{font-size:24px;font-weight:900;margin-bottom:8px;text-align:center}
.stage-subtitle{font-size:14px;color:var(--text-secondary);text-align:center;margin-bottom:24px}
.stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stage-card{background:var(--card);border-radius:20px;padding:24px 16px;text-align:center;cursor:pointer;border:3px solid var(--border);transition:all .2s;position:relative;overflow:hidden}
.stage-card:active{transform:scale(.97)}
.stage-card .stage-icon{width:56px;height:56px;border-radius:16px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.stage-card .stage-name{font-size:18px;font-weight:900;margin-bottom:4px}
.stage-card .stage-desc{font-size:12px;color:var(--text-secondary);line-height:1.5}
.stage-card .stage-count{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;background:var(--bg);padding:3px 8px;border-radius:10px;color:var(--text-secondary)}
.stage-card.locked{opacity:.5}
.stage-card.locked::after{content:'🔒';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px}

/* 年级选择 */
.grade-page{padding:20px 16px}
.grade-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{width:40px;height:40px;border-radius:50%;background:var(--card);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0}
.grade-title{font-size:22px;font-weight:900}
.grade-list{display:flex;flex-direction:column;gap:12px}
.grade-card{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:16px;cursor:pointer;border:2px solid var(--border);transition:all .2s}
.grade-card:active{transform:scale(.98)}
.grade-card .grade-num{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:var(--bg);flex-shrink:0}
.grade-card .grade-info{flex:1}
.grade-card .grade-name{font-size:16px;font-weight:700}
.grade-card .grade-lessons{font-size:12px;color:var(--text-secondary);margin-top:2px}
.grade-card .grade-arrow{color:var(--text-secondary);font-size:20px}
.grade-card.locked{opacity:.5}
.grade-card.locked .grade-arrow{content:'🔒'}

/* 学习路径 */
.learning-path{position:relative;padding:20px 16px 60px}
.path-node{display:flex;align-items:center;margin-bottom:32px;position:relative}
.path-node:nth-child(odd){justify-content:flex-start;padding-left:40px}
.path-node:nth-child(even){justify-content:flex-end;padding-right:40px}
.node-circle{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;cursor:pointer;transition:transform .15s;border:none;color:#fff;flex-shrink:0;font-size:22px;font-weight:900;letter-spacing:-1px;line-height:1}
.node-circle:active{transform:scale(.95)}
.node-circle svg{width:38px;height:38px}
.node-circle.completed{background:linear-gradient(135deg,var(--primary),var(--primary-light));box-shadow:0 5px 0 var(--primary-dark)}
.node-circle.current{background:linear-gradient(135deg,var(--yellow),#ffd633);box-shadow:0 5px 0 #cc9f00;animation:bounce 1.5s ease-in-out infinite;color:var(--bg)}
.node-circle.locked{background:var(--card);border:3px solid var(--border);color:var(--text-secondary);cursor:not-allowed;box-shadow:none}
.node-circle.test-pending{background:linear-gradient(135deg,var(--purple),#e0a8ff);box-shadow:0 5px 0 #a85fd6}
.node-label{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--text-secondary);white-space:nowrap;text-align:center;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.node-stars{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:var(--bg);padding:3px 8px;border-radius:12px;z-index:3}
.node-stars svg{width:14px;height:14px}

/* 单元标题 */
.unit-header{margin:8px 16px 16px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:16px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 0 var(--primary-dark)}
.unit-header .unit-label{font-size:12px;font-weight:700;opacity:.8;text-transform:uppercase}
.unit-header .unit-title{font-size:18px;font-weight:900;margin-top:2px}

/* 精讲页面 */
.lecture-page{padding:16px}
.lecture-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.lecture-title{font-size:20px;font-weight:900;flex:1}
.lecture-card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;border:2px solid var(--border)}
.lecture-card h3{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--primary-light);display:flex;align-items:center;gap:8px}
.lecture-card h3::before{content:'';width:4px;height:20px;background:var(--primary);border-radius:2px}
.lecture-card p{font-size:14px;line-height:1.8;margin-bottom:10px}
.formula-box{background:var(--bg);padding:14px 16px;border-radius:12px;font-family:'Times New Roman',serif;font-size:16px;text-align:center;margin:12px 0;border-left:4px solid var(--blue);color:var(--blue)}
.example-box{background:rgba(88,204,2,.1);padding:14px 16px;border-radius:12px;margin:12px 0;border-left:4px solid var(--primary)}
.example-box .example-title{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px}
.example-box p{font-size:13px;margin-bottom:4px}
.start-quiz-btn{width:100%;padding:16px;background:var(--primary);color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 var(--primary-dark);font-family:inherit;transition:transform .1s}
.start-quiz-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--primary-dark)}

/* 答题页 */
.quiz-container{min-height:100vh;display:flex;flex-direction:column}
.quiz-header{padding:16px;display:flex;align-items:center;gap:12px}
.quiz-type-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;flex-shrink:0}
.quiz-type-badge.quiz{background:var(--primary);color:#fff}
.quiz-type-badge.test{background:var(--purple);color:#fff}
.quiz-progress{flex:1;height:12px;background:var(--card);border-radius:6px;overflow:hidden;border:2px solid var(--border)}
.quiz-progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .4s ease}
.quit-btn{width:36px;height:36px;border-radius:50%;background:var(--card);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);flex-shrink:0}
.quiz-body{flex:1;padding:16px}
.question-number{font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:8px}
.question-text{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:24px}
.options-list{display:flex;flex-direction:column;gap:12px}
.option-btn{width:100%;padding:16px 20px;background:var(--card);border:2px solid var(--border);border-bottom-width:4px;border-radius:16px;font-size:15px;font-weight:600;color:var(--text);cursor:pointer;text-align:left;transition:all .15s;font-family:inherit;display:flex;align-items:center;gap:12px}
.option-btn .option-letter{width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text-secondary);flex-shrink:0}
.option-btn:active{transform:translateY(2px);border-bottom-width:2px}
.option-btn.selected{border-color:var(--blue);background:rgba(28,176,246,.1)}
.option-btn.selected .option-letter{background:var(--blue);color:#fff}
.option-btn.correct{border-color:var(--primary);background:rgba(88,204,2,.15);animation:pop .3s ease}
.option-btn.correct .option-letter{background:var(--primary);color:#fff}
.option-btn.wrong{border-color:var(--red);background:rgba(255,75,75,.15);animation:shake .4s ease}
.option-btn.wrong .option-letter{background:var(--red);color:#fff}
.option-btn:disabled{cursor:default}
.fill-input{width:100%;padding:16px 20px;border:2px solid var(--border);border-bottom-width:4px;border-radius:16px;font-size:16px;font-family:inherit;outline:none;background:var(--card);color:var(--text)}
.fill-input:focus{border-color:var(--blue)}
.quiz-footer{padding:16px;background:var(--bg-card);border-top:2px solid var(--border)}
.submit-btn{width:100%;padding:16px;background:var(--blue);color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--blue-dark);font-family:inherit;transition:all .1s}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.submit-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--blue-dark)}
.feedback-banner{padding:16px 20px;margin:0 16px 16px;border-radius:16px;animation:pop .3s ease}
.feedback-banner.correct{background:rgba(88,204,2,.15);border:2px solid var(--primary)}
.feedback-banner.wrong{background:rgba(255,75,75,.15);border:2px solid var(--red)}
.feedback-banner .feedback-title{font-size:16px;font-weight:900;margin-bottom:4px}
.feedback-banner.correct .feedback-title{color:var(--primary)}
.feedback-banner.wrong .feedback-title{color:var(--red)}
.feedback-banner .feedback-detail{font-size:13px;line-height:1.6;color:var(--text-secondary)}

/* 结算页 */
.result-container{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.result-icon{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:pop .5s ease}
.result-icon.pass{background:linear-gradient(135deg,var(--primary),var(--primary-light));box-shadow:0 8px 32px rgba(88,204,2,.4)}
.result-icon.fail{background:linear-gradient(135deg,var(--red),#ff7676);box-shadow:0 8px 32px rgba(255,75,75,.4)}
.result-icon.test{background:linear-gradient(135deg,var(--purple),#e0a8ff);box-shadow:0 8px 32px rgba(206,130,255,.4)}
.result-icon svg{width:56px;height:56px;color:#fff}
.result-title{font-size:28px;font-weight:900;margin-bottom:8px}
.result-subtitle{font-size:15px;color:var(--text-secondary);margin-bottom:32px}
.result-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:320px;margin-bottom:24px}
.result-stat{background:var(--card);border-radius:16px;padding:16px;border:2px solid var(--border)}
.result-stat .stat-value{font-size:24px;font-weight:900;color:var(--primary)}
.result-stat .stat-label{font-size:12px;color:var(--text-secondary);margin-top:4px}
.result-stars{display:flex;gap:8px;margin-bottom:24px}
.result-stars svg{width:40px;height:40px;color:var(--border);transition:color .3s}
.result-stars svg.earned{color:var(--yellow)}
.result-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.btn-primary{width:100%;padding:16px;background:var(--primary);color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--primary-dark);font-family:inherit;transition:transform .1s}
.btn-primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--primary-dark)}
.btn-secondary{width:100%;padding:16px;background:var(--card);color:var(--text);border:2px solid var(--border);border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}

/* 打卡页 */
.checkin-page{padding:16px}
.checkin-card{background:linear-gradient(135deg,var(--orange),#ffb347);border-radius:20px;padding:24px;text-align:center;margin-bottom:20px;box-shadow:0 4px 0 #cc7700}
.checkin-card .streak-num{font-size:56px;font-weight:900;color:#fff;line-height:1;margin:8px 0}
.checkin-card .streak-label{font-size:14px;color:rgba(255,255,255,.9);font-weight:600}
.calendar-card{background:var(--card);border-radius:16px;padding:20px;border:2px solid var(--border);margin-bottom:16px}
.calendar-month{font-size:16px;font-weight:700;text-align:center;margin-bottom:16px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.calendar-day-header{text-align:center;font-size:11px;font-weight:700;color:var(--text-secondary);padding:4px 0}
.calendar-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;font-weight:600}
.calendar-day.checked{background:var(--primary);color:#fff}
.calendar-day.today{border:2px solid var(--orange);font-weight:900}
.calendar-day.future{color:var(--border)}
.calendar-day.empty{visibility:hidden}
.checkin-btn{width:100%;padding:16px;background:var(--primary);color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--primary-dark);font-family:inherit}
.checkin-btn:disabled{opacity:.5;cursor:not-allowed}

/* 个人中心 */
.profile-page{padding:16px}
.profile-header{text-align:center;padding:24px 0}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#5cc8f8);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;border:3px solid var(--card);overflow:hidden}
.profile-name{font-size:22px;font-weight:900;margin-bottom:4px}
.profile-level{display:inline-block;background:var(--card);padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;border:2px solid var(--border);color:var(--primary)}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.profile-stat-card{background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;border:2px solid var(--border)}
.profile-stat-card .value{font-size:20px;font-weight:900;color:var(--primary)}
.profile-stat-card .label{font-size:11px;color:var(--text-secondary);margin-top:4px}
.section-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.progress-overview{background:var(--card);border-radius:16px;padding:16px;border:2px solid var(--border);margin-bottom:16px}
.stage-progress-item{margin-bottom:14px}
.stage-progress-item:last-child{margin-bottom:0}
.stage-progress-header{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.stage-progress-bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.stage-progress-fill{height:100%;border-radius:5px;transition:width .6s ease}
.reset-btn{width:100%;padding:14px;background:transparent;color:var(--red);border:2px solid var(--red);border-radius:16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:20px}

/* Kevin角色 */
.kevin-character{position:fixed;bottom:80px;left:16px;z-index:50;cursor:pointer;transition:transform .3s}
.kevin-character:hover{transform:scale(1.05)}
.kevin-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#ffd6a5,#ffb380);display:flex;align-items:center;justify-content:center;border:3px solid var(--card);box-shadow:0 4px 12px rgba(0,0,0,.3);position:relative;overflow:hidden}
.kevin-name{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--card);padding:2px 10px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap;border:2px solid var(--border)}
.kevin-speech{position:absolute;bottom:68px;left:0;background:#fff;color:var(--bg);padding:8px 12px;border-radius:12px;font-size:12px;font-weight:600;max-width:160px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:10}
.kevin-speech.show{display:block;animation:pop .3s ease}
.kevin-speech::after{content:'';position:absolute;bottom:-6px;left:20px;width:12px;height:12px;background:#fff;transform:rotate(45deg)}

/* 底部导航 */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg-card);border-top:2px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;cursor:pointer;color:var(--text-secondary);border:none;background:none;font-family:inherit;transition:color .2s}
.nav-item.active{color:var(--primary)}
.nav-item svg{width:26px;height:26px}
.nav-item span{font-size:10px;font-weight:700}

/* Toast */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--card);color:var(--text);padding:12px 24px;border-radius:24px;font-size:14px;font-weight:600;z-index:1000;transition:transform .3s ease;border:2px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

/* 加载中 */
.loading-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.loading-screen .loading-icon{width:60px;height:60px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen .loading-text{font-size:16px;font-weight:700;color:var(--text-secondary)}
</style>
</head>
<body>

<div id="loading-screen" class="loading-screen">
  <div class="loading-icon"></div>
  <div class="loading-text">Kevin正在准备数学冒险...</div>
</div>

<!-- 阶段选择 -->
<div id="view-stage" class="view">
  <div class="top-bar">
    <div class="level-badge"><div class="flag">数</div><span class="level-text" id="level-text-stage">Lv.1</span></div>
    <div class="stat-item" style="color:var(--orange)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67z"/></svg><span id="streak-stage">0</span></div>
    <div class="stat-item" style="color:var(--blue)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h12l4 6-10 14L2 8l4-6z"/></svg><span id="gems-stage">0</span></div>
  </div>
  <div class="xp-bar-container"><div class="xp-label"><span id="xp-current-stage">0 XP</span><span id="xp-next-stage">下一级 100 XP</span></div><div class="xp-bar"><div class="xp-fill" id="xp-fill-stage" style="width:0%"></div></div></div>
  <div class="stage-page">
    <div class="stage-title">选择学习阶段</div>
    <div class="stage-subtitle">从小学到大学高数，224个知识点等你征服</div>
    <div class="stage-grid" id="stage-grid"></div>
  </div>
</div>

<!-- 年级选择 -->
<div id="view-grade" class="view">

<div class="toast" id="toast"></div>

<script>
// Kevin SVG
const KEVIN_SVG = `<svg width="52" height="52" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="32" fill="#FFD6A5"/><path d="M16 28c0-8.8 7.2-16 16-16s16 7.2 16 16v4H16v-4z" fill="#4A3728"/><path d="M18 26c2-4 6-7 14-7s12 3 14 7c-2-1-4-2-7-2-5 0-8 2-10 3-2 1-5 2-7 2-1 0-3-1-4-3z" fill="#5D4037"/><circle cx="24" cy="32" r="3" fill="#2D1B0E"/><circle cx="40" cy="32" r="3" fill="#2D1B0E"/><circle cx="25" cy="31" r="1" fill="#fff"/><circle cx="41" cy="31" r="1" fill="#fff"/><path d="M26 42c2 2 4 3 6 3s4-1 6-3" stroke="#2D1B0E" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="20" cy="38" r="2.5" fill="#FFB3B3" opacity=".6"/><circle cx="44" cy="38" r="2.5" fill="#FFB3B3" opacity=".6"/></svg>`;

// 等级系统
const LEVELS = [{level:1,name:'数学新手',xp:0},{level:2,name:'算术学徒',xp:100},{level:3,name:'计算能手',xp:250},{level:4,name:'代数入门',xp:500},{level:5,name:'方程达人',xp:800},{level:6,name:'几何学者',xp:1200},{level:7,name:'函数高手',xp:1700},{level:8,name:'数学达人',xp:2500},{level:9,name:'数学大师',xp:4000},{level:10,name:'数学传奇',xp:6000}];

// 状态
const STORAGE_KEY = 'math_quest_v3_progress';
let state = {xp:0,gems:0,completedLessons:{},checkinDates:[],streak:0,totalQuestions:0,correctQuestions:0,currentStage:'elementary',currentGrade:null};

function loadState(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)state={...state,...JSON.parse(s)}}catch(e){}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}

function getCurrentLevel(){let c=LEVELS[0];for(const l of LEVELS)if(state.xp>=l.xp)c=l;return c}
function getNextLevel(){const c=getCurrentLevel();const i=LEVELS.findIndex(l=>l.level===c.level);return i<LEVELS.length-1?LEVELS[i+1]:null}

// 数据加载
const DATA_FILES = {elementary:'data/elementary.js',junior:'data/junior.js',senior:'data/senior.js',college:'data/college.js'};
const DATA_VARS = {elementary:'ELEMENTARY_DATA',junior:'JUNIOR_DATA',senior:'SENIOR_DATA',college:'COLLEGE_DATA'};
let loadedData = {};

function loadStageData(stage){
  return new Promise((resolve,reject)=>{
    if(loadedData[stage]){resolve(loadedData[stage]);return}
    const script=document.createElement('script');
    script.src=DATA_FILES[stage];
    script.onload=()=>{loadedData[stage]=window[DATA_VARS[stage]];resolve(loadedData[stage])};
    script.onerror=()=>reject(new Error('数据加载失败: '+stage));
    document.head.appendChild(script);
  });
}

// 阶段配置
const STAGES = [
  {id:'elementary',name:'小学',desc:'1-6年级基础数学',color:'#58cc02',icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>'},
  {id:'junior',name:'初中',desc:'初一到初三代数几何',color:'#1cb0f6',icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg>'},
  {id:'senior',name:'高中',desc:'高一到高三函数微积分',color:'#ce82ff',icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>'},
  {id:'college',name:'大学高数',desc:'极限微积分微分方程',color:'#ff9600',icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>'}
];

function isStageUnlocked(stageId){
  // 小学始终解锁
  if(stageId==='elementary')return true;
  // 其他阶段需要完成前一个阶段所有知识点
  const stageOrder=['elementary','junior','senior','college'];
  const idx=stageOrder.indexOf(stageId);
  if(idx<=0)return true;
  const prevStage=stageOrder[idx-1];
  const prevData=loadedData[prevStage]||window[DATA_VARS[prevStage]];
  if(!prevData)return false;
  // 前一个阶段所有年级的所有知识点都检验通过
  return prevData.grades.every(g=>g.lessons.every(l=>{
    const s=state.completedLessons[l.id];
    return s&&s.testPassed;
  }));
}

// 路由
function navigate(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const nav=document.querySelector(`.nav-item[data-view="${view}"]`);
  if(nav)nav.classList.add('active');
  window.scrollTo(0,0);
  if(view==='stage')renderStagePage();
  if(view==='grade')renderGradePage();
  if(view==='home')renderHome();
  if(view==='checkin')renderCheckin();
  if(view==='profile')renderProfile();
}

function updateTopBar(prefix){
  const lvl=getCurrentLevel(),next=getNextLevel();
  const p=prefix||'';
  const set=(id,val)=>{const el=document.getElementById(id+p);if(el)el.textContent=val};
  set('level-text','Lv.'+lvl.level);
  set('streak-num',state.streak);
  set('gems-num',state.gems);
  set('xp-current',state.xp+' XP');
  if(next){set('xp-next','下一级 '+next.xp+' XP');const fill=document.getElementById('xp-fill'+p);if(fill)fill.style.width=Math.min(100,((state.xp-lvl.xp)/(next.xp-lvl.xp))*100)+'%'}
  else{set('xp-next','已满级');const fill=document.getElementById('xp-fill'+p);if(fill)fill.style.width='100%'}
}

// 阶段选择页
function renderStagePage(){
  updateTopBar('-stage');
  const grid=document.getElementById('stage-grid');
  grid.innerHTML='';
  STAGES.forEach(stage=>{
    const unlocked=isStageUnlocked(stage.id);
    const data=loadedData[stage.id]||window[DATA_VARS[stage.id]];
    const count=data?data.grades.reduce((s,g)=>s+g.lessons.length,0):'...';
    const card=document.createElement('div');
    card.className='stage-card'+(unlocked?'':' locked');
    card.innerHTML=`<div class="stage-count">${count}关</div><div class="stage-icon" style="background:${stage.color}20;color:${stage.color}">${stage.icon}</div><div class="stage-name">${stage.name}</div><div class="stage-desc">${stage.desc}</div>`;
    if(unlocked)card.onclick=()=>selectStage(stage.id);
    grid.appendChild(card);
  });
}

async function selectStage(stageId){
  state.currentStage=stageId;
  state.currentGrade=null;
  saveState();
  try{
    await loadStageData(stageId);
    navigate('grade');
  }catch(e){showToast('数据加载失败，请刷新重试')}
}

// 年级选择页
function renderGradePage(){
  const data=loadedData[state.currentStage];
  const stage=STAGES.find(s=>s.id===state.currentStage);
  document.getElementById('grade-page-title').textContent=stage.name;
  const list=document.getElementById('grade-list');
  list.innerHTML='';
  data.grades.forEach((grade,idx)=>{
    const unlocked=isGradeUnlocked(grade.id,idx);
    const completed=grade.lessons.filter(l=>{const s=state.completedLessons[l.id];return s&&s.testPassed}).length;
    const card=document.createElement('div');
    card.className='grade-card'+(unlocked?'':' locked');
    card.innerHTML=`<div class="grade-num" style="background:${stage.color}">${idx+1}</div><div class="grade-info"><div class="grade-name">${grade.name}</div><div class="grade-lessons">${grade.lessons.length}个知识点 · 已完成${completed}个</div></div><div class="grade-arrow">${unlocked?'›':'🔒'}</div>`;
    if(unlocked)card.onclick=()=>selectGrade(grade.id);
    list.appendChild(card);
  });
}

function isGradeUnlocked(gradeId,idx){
  // 小学1年级、2年级始终解锁（2年级第一个知识点要解锁）
  if(state.currentStage==='elementary'&&idx<=1)return true;
  // 其他年级需要完成前一个年级所有知识点
  if(idx<=0)return true;
  const data=loadedData[state.currentStage];
  if(!data)return false;
  const prevGrade=data.grades[idx-1];
  return prevGrade.lessons.every(l=>{
    const s=state.completedLessons[l.id];
    return s&&s.testPassed;
  });
}

function selectGrade(gradeId){
  state.currentGrade=gradeId;
  saveState();
  navigate('home');
}

// 获取当前年级课程
function getCurrentGradeLessons(){
  const data=loadedData[state.currentStage];
  const grade=data.grades.find(g=>g.id===state.currentGrade);
  return grade?grade.lessons:[];
}

// 关卡解锁
function isLessonUnlocked(lessonId){
  const lessons=getCurrentGradeLessons();
  const idx=lessons.findIndex(l=>l.id===lessonId);
  if(idx<0)return false;
  const data=loadedData[state.currentStage];
  // 小学1年级（第一个年级）所有知识点解锁
  if(state.currentStage==='elementary'&&state.currentGrade===data.grades[0].id)return true;
  // 小学2年级第一个知识点解锁
  if(state.currentStage==='elementary'&&state.currentGrade===data.grades[1].id&&idx===0)return true;
  // 其他知识点：第一个始终解锁，后续需要前一个检验通过
  if(idx===0)return true;
  const prevLesson=lessons[idx-1];
  const s=state.completedLessons[prevLesson.id];
  return s&&s.testPassed;
}

// 学习路径
function renderHome(){
  updateTopBar('');
  const data=loadedData[state.currentStage];
  const grade=data.grades.find(g=>g.id===state.currentGrade);
  const stage=STAGES.find(s=>s.id===state.currentStage);
  document.getElementById('unit-label').textContent=stage.name+' · '+grade.name;
  document.getElementById('unit-title').textContent=grade.name+'数学';

  const path=document.getElementById('learning-path');
  path.innerHTML='';
  grade.lessons.forEach((lesson,idx)=>{
    const ls=state.completedLessons[lesson.id];
    const unlocked=isLessonUnlocked(lesson.id);
    const quizPassed=ls&&ls.quizPassed;
    const testPassed=ls&&ls.testPassed;
    const isCurrent=unlocked&&(!quizPassed||!testPassed);

    let cls='locked',content=lesson.icon||'?';
    if(quizPassed&&testPassed){cls='completed';content='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'}
    else if(quizPassed&&!testPassed){cls='test-pending';content='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 6l7.53 13H4.47L12 8zm-1 4v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>'}
    else if(isCurrent){cls='current';content=lesson.icon||'?'}

    const stars=ls?ls.stars:0;
    const node=document.createElement('div');
    node.className='path-node';
    node.innerHTML=`<button class="node-circle ${cls}" ${unlocked?`onclick="openLesson('${lesson.id}')"`:'disabled'}>${content}${(quizPassed&&testPassed)?`<div class="node-stars">${[1,2,3].map(s=>`<svg viewBox="0 0 24 24" fill="${s<=stars?'#ffc800':'#37464f'}"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>`).join('')}</div>`:''}<div class="node-label">${lesson.title}</div></button>`;
    path.appendChild(node);
  });
}

// 精讲
let currentLesson=null;
function openLesson(lessonId){
  const lessons=getCurrentGradeLessons();
  currentLesson=lessons.find(l=>l.id===lessonId);
  if(!currentLesson)return;
  const page=document.getElementById('lecture-page');
  page.innerHTML=`<div class="lecture-header"><button class="back-btn" onclick="navigate('home')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><div class="lecture-title">${currentLesson.title}</div></div>${currentLesson.lecture.sections.map(s=>`<div class="lecture-card"><h3>${s.title}</h3><p>${s.content}</p>${s.formula?`<div class="formula-box">${s.formula}</div>`:''}${s.example?`<div class="example-box"><div class="example-title">${s.example.title}</div><p>${s.example.content}</p></div>`:''}</div>`).join('')}<button class="start-quiz-btn" onclick="startQuiz()">开始闯关</button>`;
  navigate('lecture');
}

// 答题
let quizState={questions:[],currentIndex:0,correctCount:0,selectedAnswer:null,answered:false,type:'quiz'};
function startQuiz(){
  if(!currentLesson)return;
  quizState={questions:[...currentLesson.quiz],currentIndex:0,correctCount:0,selectedAnswer:null,answered:false,type:'quiz'};
  navigate('quiz');renderQuestion();
}
function startTest(){
  if(!currentLesson)return;
  quizState={questions:[...currentLesson.test],currentIndex:0,correctCount:0,selectedAnswer:null,answered:false,type:'test'};
  navigate('quiz');renderQuestion();
}

function renderQuestion(){
  const q=quizState.questions[quizState.currentIndex];
  const total=quizState.questions.length;
  document.getElementById('quiz-progress-fill').style.width=(quizState.currentIndex/total)*100+'%';
  document.getElementById('quiz-type-badge').textContent=quizState.type==='quiz'?'闯关':'检验';
  document.getElementById('quiz-type-badge').className='quiz-type-badge '+quizState.type;
  const body=document.getElementById('quiz-body');
  body.innerHTML=`<div class="question-number">第 ${quizState.currentIndex+1} 题 / 共 ${total} 题</div><div class="question-text">${q.q}</div>`;
  quizState.selectedAnswer=null;quizState.answered=false;

  if(q.type==='choice'){
    const list=document.createElement('div');list.className='options-list';
    q.options.forEach((opt,i)=>{
      const btn=document.createElement('button');btn.className='option-btn';
      btn.innerHTML=`<span class="option-letter">${String.fromCharCode(65+i)}</span><span>${opt}</span>`;
      btn.onclick=()=>selectOption(i,btn);list.appendChild(btn);
    });
    body.appendChild(list);
  }else if(q.type==='fill'){
    const input=document.createElement('input');input.type='text';input.className='fill-input';input.placeholder='请输入答案';input.id='fill-answer';
    body.appendChild(input);
  }

  const footer=document.getElementById('quiz-footer');footer.innerHTML='';
  const btn=document.createElement('button');btn.className='submit-btn';btn.textContent='确认答案';btn.disabled=true;btn.id='submit-btn';btn.onclick=submitAnswer;
  footer.appendChild(btn);
  if(q.type==='fill')document.getElementById('fill-answer').addEventListener('input',e=>{btn.disabled=e.target.value.trim()===''});
}

function selectOption(i,btn){
  if(quizState.answered)return;
  document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');quizState.selectedAnswer=i;
  document.getElementById('submit-btn').disabled=false;
}

function submitAnswer(){
  if(quizState.answered)return;
  const q=quizState.questions[quizState.currentIndex];
  let userAnswer=null,isCorrect=false;
  if(q.type==='choice'){
    if(quizState.selectedAnswer===null)return;
    userAnswer=quizState.selectedAnswer;isCorrect=userAnswer===q.answer;
  }else if(q.type==='fill'){
    const input=document.getElementById('fill-answer');
    userAnswer=input.value.trim();isCorrect=userAnswer===q.answer;
  }
  quizState.answered=true;state.totalQuestions++;
  if(q.type==='choice'){
    document.querySelectorAll('.option-btn').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');else if(i===quizState.selectedAnswer&&!isCorrect)b.classList.add('wrong')});
  }
  const body=document.getElementById('quiz-body');
  const old=body.querySelector('.feedback-banner');if(old)old.remove();
  const banner=document.createElement('div');
  banner.className='feedback-banner '+(isCorrect?'correct':'wrong');
  if(isCorrect){
    quizState.correctCount++;state.correctQuestions++;
    const xp=quizState.type==='quiz'?10:5;state.xp+=xp;
    banner.innerHTML=`<div class="feedback-title">回答正确！</div><div class="feedback-detail">+${xp} XP</div>`;
  }else{
    const correctText=q.type==='choice'?q.options[q.answer]:q.answer;
    banner.innerHTML=`<div class="feedback-title">回答错误</div><div class="feedback-detail">正确答案：${correctText}</div>`;
  }
  body.appendChild(banner);saveState();

  // 自动跳转：正确后1秒自动下一题，错误后显示按钮
  if(isCorrect){
    const footer=document.getElementById('quiz-footer');footer.innerHTML='';
    const btn=document.createElement('button');btn.className='submit-btn correct-mode';btn.textContent='下一题 →';btn.onclick=nextQuestion;
    footer.appendChild(btn);
    setTimeout(()=>{if(quizState.answered)nextQuestion()},1200);
  }else{
    const footer=document.getElementById('quiz-footer');footer.innerHTML='';
    const btn=document.createElement('button');btn.className='submit-btn wrong-mode';
    btn.textContent=quizState.currentIndex<quizState.questions.length-1?'下一题':'查看结果';
    btn.onclick=nextQuestion;footer.appendChild(btn);
  }
}

function nextQuestion(){
  if(quizState.currentIndex<quizState.questions.length-1){quizState.currentIndex++;renderQuestion()}
  else showResult();
}

function quitQuiz(){
  if(confirm('确定要退出吗？当前进度将不会保存。'))navigate('home');
}

// 结算
function showResult(){
  const total=quizState.questions.length,correct=quizState.correctCount;
  const accuracy=Math.round(correct/total*100),isQuiz=quizState.type==='quiz';
  const passed=accuracy>=60;
  const c=document.getElementById('result-container');c.innerHTML='';
  const icon=document.createElement('div');
  icon.className='result-icon '+(passed?(isQuiz?'pass':'test'):'fail');
  icon.innerHTML=passed?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  c.appendChild(icon);
  const title=document.createElement('div');title.className='result-title';
  title.textContent=isQuiz?(passed?'闯关成功！':'继续加油！'):(passed?'检验通过！':'检验未通过');
  c.appendChild(title);
  const sub=document.createElement('div');sub.className='result-subtitle';
  sub.textContent=currentLesson?currentLesson.title+(isQuiz?' · 闯关':' · 检验测试'):'';
  c.appendChild(sub);

  if(isQuiz&&passed){
    const stars=accuracy>=90?3:(accuracy>=70?2:1);
    const sd=document.createElement('div');sd.className='result-stars';
    for(let i=1;i<=3;i++){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','currentColor');s.innerHTML='<path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>';if(i<=stars)s.classList.add('earned');sd.appendChild(s)}
    c.appendChild(sd);
    if(!state.completedLessons[currentLesson.id])state.completedLessons[currentLesson.id]={stars:0,quizPassed:false,testPassed:false};
    state.completedLessons[currentLesson.id].quizPassed=true;
    if(stars>state.completedLessons[currentLesson.id].stars)state.completedLessons[currentLesson.id].stars=stars;
    state.gems+=5;saveState();
  }
  if(!isQuiz&&passed){
    if(!state.completedLessons[currentLesson.id])state.completedLessons[currentLesson.id]={stars:0,quizPassed:false,testPassed:false};
    state.completedLessons[currentLesson.id].testPassed=true;state.xp+=20;state.gems+=10;saveState();
  }

  const stats=document.createElement('div');stats.className='result-stats';
  stats.innerHTML=`<div class="result-stat"><div class="stat-value">${correct}/${total}</div><div class="stat-label">答对题数</div></div><div class="result-stat"><div class="stat-value">${accuracy}%</div><div class="stat-label">正确率</div></div><div class="result-stat"><div class="stat-value">${state.gems}</div><div class="stat-label">宝石</div></div><div class="result-stat"><div class="stat-value">${state.xp}</div><div class="stat-label">总经验</div></div>`;
  c.appendChild(stats);

  const actions=document.createElement('div');actions.className='result-actions';
  if(isQuiz&&passed){
    const b1=document.createElement('button');b1.className='btn-primary';b1.textContent='去做检验测试';b1.onclick=()=>startTest();actions.appendChild(b1);
    const b2=document.createElement('button');b2.className='btn-secondary';b2.textContent='返回学习路径';b2.onclick=()=>navigate('home');actions.appendChild(b2);
  }else if(isQuiz&&!passed){
    const b1=document.createElement('button');b1.className='btn-primary';b1.textContent='再试一次';b1.onclick=()=>startQuiz();actions.appendChild(b1);
    const b2=document.createElement('button');b2.className='btn-secondary';b2.textContent='返回学习路径';b2.onclick=()=>navigate('home');actions.appendChild(b2);
  }else if(!isQuiz&&passed){
    const b1=document.createElement('button');b1.className='btn-primary';b1.textContent='继续下一关';
    b1.onclick=()=>{const lessons=getCurrentGradeLessons();const idx=lessons.findIndex(l=>l.id===currentLesson.id);if(idx<lessons.length-1)openLesson(lessons[idx+1].id);else{showToast('恭喜完成本年级全部关卡！');navigate('grade')}};
    actions.appendChild(b1);
    const b2=document.createElement('button');b2.className='btn-secondary';b2.textContent='返回学习路径';b2.onclick=()=>navigate('home');actions.appendChild(b2);
  }else{
    const b1=document.createElement('button');b1.className='btn-primary';b1.textContent='重新检验';b1.onclick=()=>startTest();actions.appendChild(b1);
    const b2=document.createElement('button');b2.className='btn-secondary';b2.textContent='返回学习路径';b2.onclick=()=>navigate('home');actions.appendChild(b2);
  }
  c.appendChild(actions);navigate('result');
}

// 打卡
function renderCheckin(){
  document.getElementById('checkin-streak').textContent=state.streak;
  const now=new Date(),year=now.getFullYear(),month=now.getMonth(),today=now.getDate();
  const names=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('calendar-month').textContent=year+'年 '+names[month];
  const grid=document.getElementById('calendar-grid');grid.innerHTML='';
  ['日','一','二','三','四','五','六'].forEach(d=>{const h=document.createElement('div');h.className='calendar-day-header';h.textContent=d;grid.appendChild(h)});
  const firstDay=new Date(year,month,1).getDay(),daysInMonth=new Date(year,month+1,0).getDate();
  for(let i=0;i<firstDay;i++){const e=document.createElement('div');e.className='calendar-day empty';grid.appendChild(e)}
  for(let d=1;d<=daysInMonth;d++){
    const el=document.createElement('div');el.className='calendar-day';el.textContent=d;
    const ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    if(state.checkinDates.includes(ds))el.classList.add('checked');
    if(d===today)el.classList.add('today');
    if(d>today)el.classList.add('future');
    grid.appendChild(el);
  }
  const todayStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(today).padStart(2,'0');
  const btn=document.getElementById('checkin-btn');
  if(state.checkinDates.includes(todayStr)){btn.textContent='今日已打卡';btn.disabled=true}
  else{btn.textContent='今日打卡';btn.disabled=false}
}
function doCheckin(){
  const now=new Date(),todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  if(state.checkinDates.includes(todayStr)){showToast('今日已打卡');return}
  const y=new Date(now);y.setDate(now.getDate()-1);
  const yStr=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  state.streak=state.checkinDates.includes(yStr)?state.streak+1:1;
  state.checkinDates.push(todayStr);state.xp+=5;state.gems+=2;saveState();
  showToast('打卡成功！连续'+state.streak+'天，+5 XP +2 宝石');renderCheckin();
}

// 个人中心
function renderProfile(){
  const lvl=getCurrentLevel();
  document.getElementById('profile-level').textContent='Lv.'+lvl.level+' '+lvl.name;
  document.getElementById('profile-xp').textContent=state.xp;
  document.getElementById('profile-lessons').textContent=Object.values(state.completedLessons).filter(s=>s.quizPassed&&s.testPassed).length;
  document.getElementById('profile-accuracy').textContent=state.totalQuestions>0?Math.round(state.correctQuestions/state.totalQuestions*100)+'%':'0%';
  document.getElementById('profile-avatar').innerHTML=KEVIN_SVG;
  const po=document.getElementById('progress-overview');po.innerHTML='';
  const colors=['#58cc02','#1cb0f6','#ce82ff','#ff9600'];
  STAGES.forEach((stage,idx)=>{
    const data=loadedData[stage.id]||window[DATA_VARS[stage.id]];
    if(!data)return;
    const total=data.grades.reduce((s,g)=>s+g.lessons.length,0);
    const completed=data.grades.reduce((s,g)=>s+g.lessons.filter(l=>{const st=state.completedLessons[l.id];return st&&st.testPassed}).length,0);
    const pct=total>0?completed/total*100:0;
    const item=document.createElement('div');item.className='stage-progress-item';
    item.innerHTML=`<div class="stage-progress-header"><span>${stage.name}</span><span>${completed}/${total} 关</span></div><div class="stage-progress-bar"><div class="stage-progress-fill" style="width:${pct}%;background:${stage.color}"></div></div>`;
    po.appendChild(item);
  });
}

function resetProgress(){
  if(confirm('确定要重置所有学习进度吗？此操作不可恢复！')){
    localStorage.removeItem(STORAGE_KEY);
    state={xp:0,gems:0,completedLessons:{},checkinDates:[],streak:0,totalQuestions:0,correctQuestions:0,currentStage:'elementary',currentGrade:null};
    showToast('进度已重置');navigate('stage');
  }
}

// Kevin

const kevinTips=['你好！我是Kevin，一起学数学吧！','每天坚持学习，你会越来越棒！','闯关成功后记得做检验测试哦！','答错了没关系，再试一次！','数学很有趣，让我们一起探索吧！','打卡可以获得宝石和经验值！','从小学开始，一步一个脚印！'];
function showKevinTip(){const s=document.getElementById('kevin-speech');s.textContent=kevinTips[Math.floor(Math.random()*kevinTips.length)];s.classList.add('show');setTimeout(()=>s.classList.remove('show'),3000)}
function toggleKevinSpeech(){showKevinTip()}

// Toast
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

// 初始化
async function init(){
  loadState();initKevin();
  try{
    // 预加载小学数据
    await loadStageData('elementary');
    document.getElementById('loading-screen').style.display='none';
    navigate('stage');
  }catch(e){
    document.getElementById('loading-screen').style.display='none';
    showToast('数据加载失败，请刷新重试');
  }
}
init();
</script>
